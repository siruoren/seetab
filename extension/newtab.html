<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title.newtab">新标签页</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="weather-widget" id="weather">
      <span class="weather-icon" id="weatherIcon">🌤️</span>
      <span class="weather-temp" id="weatherTemp">--°</span>
      <span class="weather-city" id="weatherCity"></span>
      <input type="text" class="weather-city-input" id="weatherCityInput" data-i18n-placeholder="weather.city.placeholder" placeholder="输入城市">
    </div>
  </div>
  <div class="topbar-center">
    <div class="topbar-date" id="date"></div>
    <div class="topbar-clock" id="clock"></div>
    <div class="topbar-weekday" id="weekday"></div>
  </div>
  <div class="topbar-right">
    <div class="theme-toggle" id="themeToggle" data-i18n-title="theme.toggle" title="切换主题">
      <span class="theme-icon" id="themeIcon">🌙</span>
    </div>
    <div class="repo-btn topbar-icon-btn" id="repoBtn" data-i18n-title="repo.tooltip" title="书签数据来源">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.66-.22.66-.48 0-.24-.01-.87-.01-1.71-2.78.61-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.34.85.01 1.7.12 2.5.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85 0 1.34-.01 2.42-.01 2.75 0 .27.16.58.67.48A10.02 10.02 0 0022 12c0-5.52-4.48-10-10-10z" fill="currentColor"/></svg>
    </div>
    <div class="save-bm-btn topbar-icon-btn" id="saveBmBtn" data-i18n-title="bookmark.save.title" title="保存远程书签到本地">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z" fill="currentColor"/></svg>
    </div>
    <div class="settings-btn topbar-icon-btn" id="settingsBtn" data-i18n-title="settings.title" title="设置">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z" fill="currentColor"/></svg>
    </div>
  </div>
</div>

<div class="container">
  <div class="search-section">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
      <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="搜索书签或输入网址..." autocomplete="off">
      <button class="search-clear" id="searchClear" data-i18n-title="search.clear" title="清空">✕</button>
      <button class="search-go" id="searchGo" data-i18n-title="search.go" title="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="footer-bar">
    <div class="backend-status" id="backendStatus" title="">
      <span class="backend-status-dot"></span>
    </div>
    <div class="update-info" id="updateInfo"></div>
  </div>
</div>

<script src="pinyin.js"></script>
<script src="i18n.js"></script>
<script src="newtab.js"></script>
</body>
</html>
